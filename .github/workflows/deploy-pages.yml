name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Spec changes in open-playlist-engine are picked up by this periodic schedule.
    - cron: "20 4 * * *"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC_URL: https://raw.githubusercontent.com/mbianchidev/open-playlist-engine/main/openapi/open-playlist.yaml
      # Optional for public specs; required if open-playlist-engine is private.
      OPENAPI_SPEC_TOKEN: ${{ secrets.OPEN_PLAYLIST_ENGINE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Publish the canonical OpenAPI spec from open-playlist-engine alongside the site.
          curl_args=(--fail --location --show-error --silent --retry 3)
          if [ -n "$OPENAPI_SPEC_TOKEN" ]; then
            curl_args+=(--header "Authorization: Bearer "$OPENAPI_SPEC_TOKEN)
          fi
          curl "${curl_args[@]}" "$OPENAPI_SPEC_URL" --output _site/open-playlist.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
