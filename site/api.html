<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API reference | Open Playlist</title>
  <meta name="description" content="Interactive reference for the Open Playlist OpenAPI specification." />
  <meta name="theme-color" content="#0e1f4a" />
  <link rel="canonical" href="https://open-playlist.synctune.it/api.html" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" sizes="any" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>body { margin: 0; }</style>
</head>
<body>
  <div class="api-topbar">
    <a class="brand" href="./" aria-label="Open Playlist home">
      <img class="logo-dark" src="assets/logo-on-dark.svg" alt="Open Playlist" width="180" height="54" />
      <img class="logo-light" src="assets/logo-on-light.svg" alt="Open Playlist" width="180" height="54" />
    </a>
    <div class="api-actions">
      <button class="theme-toggle" type="button" data-theme-toggle>
        <span class="theme-toggle-icon" aria-hidden="true"></span>
        <span data-theme-toggle-label>Light mode</span>
      </button>
      <a class="back" href="./">← Back to home</a>
    </div>
  </div>
  <div id="redoc-container">
    <noscript>
      <p style="padding:2rem;text-align:center">
        This API reference requires JavaScript. You can view the raw
        <a href="open-playlist.yaml">OpenAPI specification</a> directly.
      </p>
    </noscript>
  </div>
  <script type="module">
    const container = document.getElementById('redoc-container');
    const specUrl = 'open-playlist.yaml';

    try {
      const { init } = await import('https://cdn.redoc.ly/redoc/v3.2.0/bundles/redoc.standalone.js');
      init(
        specUrl,
        {
          disableTelemetry: true,
          downloadUrls: [{ title: 'Download OpenAPI description', url: specUrl }]
        },
        container
      );
    } catch (error) {
      console.error('Unable to load the interactive API reference.', error);
      container.innerHTML =
        '<p style="padding:2rem;text-align:center">Unable to load the interactive viewer. ' +
        'View the raw <a href="open-playlist.yaml">OpenAPI specification</a> instead.</p>';
    }
  </script>
</body>
</html>
